<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Elyro — a Mac-first local Linux Workspace</title>
  <desc id="desc">Elyro keeps project files and editing on macOS while build, test, and debug commands run in a predictable local Linux Workspace.</desc>

  <defs>
    <linearGradient id="handoff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fafff"/>
      <stop offset="1" stop-color="#5fd7d7"/>
    </linearGradient>
    <clipPath id="canvas">
      <rect width="1200" height="380" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="380" fill="#111118"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#343442" stroke-width="2"/>

  <g id="title-block" transform="translate(64 46)">
    <text fill="#87bfff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">MAC-FIRST  /  LOCAL LINUX WORKSPACE</text>
    <text x="-3" y="102" fill="#f7f7f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-5">ELYRO</text>
    <text y="160" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="650">Keep the project on your Mac.</text>
    <text y="201" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="650">Run its work in Linux.</text>

    <g transform="translate(0 245)">
      <rect width="280" height="42" rx="21" fill="#1b1b24" stroke="#343442"/>
      <text x="20" y="27" fill="#5fd7d7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">&gt; stable CLI boundary</text>
    </g>
    <g transform="translate(294 245)">
      <rect width="204" height="42" rx="21" fill="#1b1b24" stroke="#343442"/>
      <circle cx="23" cy="21" r="5" fill="#5fd787"/>
      <text x="38" y="27" fill="#c8c8cf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">human + agent</text>
    </g>
  </g>

  <g id="workspace-boundary">
    <g id="mac-host-node" transform="translate(660 70)">
      <rect width="170" height="240" rx="18" fill="#181820" stroke="#343442"/>
      <text x="24" y="38" fill="#87bfff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1">MAC HOST</text>
      <path d="M35 84h32l10 12h58v50H35z" fill="none" stroke="#5fafff" stroke-width="3" stroke-linejoin="round"/>
      <text x="85" y="192" fill="#f1f1f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">project</text>
    </g>

    <text x="898" y="152" fill="#5fd7d7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">elyro exec</text>
    <path d="M840 172H952" stroke="url(#handoff)" stroke-width="5" stroke-linecap="round"/>
    <path d="M943 164L953 172 943 180" fill="none" stroke="#5fd7d7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M952 212H840" stroke="#3c3c49" stroke-width="4" stroke-linecap="round"/>
    <path d="M849 204L839 212 849 220" fill="none" stroke="#5fafff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="898" y="240" fill="#8f8f9d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">exit 0</text>

    <g id="linux-node" transform="translate(966 70)">
      <rect width="170" height="240" rx="18" fill="#181820" stroke="#343442"/>
      <text x="24" y="38" fill="#87e0e0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1">LINUX</text>
      <rect x="14" y="82" width="142" height="64" rx="9" fill="#101016" stroke="#4b4b59"/>
      <text x="30" y="120" fill="#5fafff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">&gt;</text>
      <rect x="52" y="104" width="10" height="18" fill="#e4e4e7"/>
      <text x="78" y="121" fill="#a7a7b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">test</text>
      <text x="85" y="192" fill="#f1f1f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">workspace</text>
    </g>
  </g>
</svg>
