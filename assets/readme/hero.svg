<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Elyro — a Mac-first local Linux Workspace</title>
  <desc id="desc">Elyro keeps project files and editing on macOS while build, test, and debug commands run in a predictable local Linux Workspace.</desc>

  <defs>
    <linearGradient id="handoff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fafff"/>
      <stop offset="1" stop-color="#5fd7d7"/>
    </linearGradient>
    <clipPath id="canvas">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="420" fill="#111118"/>
    <path d="M620 0V420" stroke="#272733"/>
    <path d="M0 382H1200" stroke="#272733"/>
    <circle cx="1164" cy="36" r="86" fill="#5fafff" opacity="0.04"/>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#343442" stroke-width="2"/>

  <g id="title-block" transform="translate(64 52)">
    <text fill="#87bfff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">MAC-FIRST  /  LOCAL LINUX WORKSPACE</text>
    <text x="-3" y="102" fill="#f7f7f8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-5">ELYRO</text>
    <text y="160" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="650">Keep the project on your Mac.</text>
    <text y="201" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="650">Run its work in Linux.</text>

    <g transform="translate(0 245)">
      <rect width="280" height="42" rx="21" fill="#1b1b24" stroke="#343442"/>
      <text x="20" y="27" fill="#5fd7d7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">&gt; stable CLI boundary</text>
    </g>
    <g transform="translate(294 245)">
      <rect width="204" height="42" rx="21" fill="#1b1b24" stroke="#343442"/>
      <circle cx="23" cy="21" r="5" fill="#5fd787"/>
      <text x="38" y="27" fill="#c8c8cf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">human + agent</text>
    </g>
  </g>

  <g id="workspace-boundary">
    <text x="680" y="55" fill="#8f8f9d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.4">PROJECT HANDOFF</text>
    <text x="1136" y="55" fill="#62626d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="end">LOCAL ONLY</text>

    <g transform="translate(680 72)">
      <rect width="456" height="112" rx="18" fill="#181820" stroke="#343442"/>
      <path d="M200 20V92M280 20V92" stroke="#2c2c37"/>

      <text x="24" y="31" fill="#87bfff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">MAC HOST</text>
      <path d="M24 51h21l7 8h35v30H24z" fill="none" stroke="#5fafff" stroke-width="3" stroke-linejoin="round"/>
      <text x="104" y="77" fill="#f1f1f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">project</text>

      <text x="240" y="31" fill="#5fd7d7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">ELYRO</text>
      <path d="M218 58H262" stroke="url(#handoff)" stroke-width="4" stroke-linecap="round"/>
      <path d="M253 50L263 58 253 66" fill="none" stroke="#5fd7d7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="240" y="88" fill="#8f8f9d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">CLI</text>

      <text x="304" y="31" fill="#87e0e0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">LINUX</text>
      <rect x="304" y="47" width="128" height="45" rx="9" fill="#101016" stroke="#4b4b59"/>
      <text x="320" y="75" fill="#5fafff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">&gt;</text>
      <rect x="342" y="61" width="9" height="16" fill="#e4e4e7"/>
      <text x="367" y="76" fill="#a7a7b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">test</text>
    </g>
  </g>

  <g id="lifecycle-plan" transform="translate(680 218)">
    <rect width="456" height="146" rx="18" fill="#181820" stroke="#343442"/>
    <text x="24" y="29" fill="#8f8f9d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">LIFECYCLE PREVIEW</text>
    <circle cx="320" cy="24" r="5" fill="#ffd75f"/>
    <text x="334" y="29" fill="#ffd75f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">NO MUTATION</text>

    <path d="M24 47H432" stroke="#2c2c37"/>
    <text x="24" y="76" fill="#5fafff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">&gt;</text>
    <text x="48" y="76" fill="#f1f1f3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">elyro up --dry-run</text>
    <text x="24" y="108" fill="#a7a7b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">action</text>
    <text x="122" y="108" fill="#5fd787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">create</text>
    <text x="24" y="134" fill="#a7a7b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">reason</text>
    <text x="122" y="134" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">workspace absent</text>
  </g>

  <g id="lifecycle-sequence" transform="translate(680 393)">
    <circle r="5" fill="#5fafff"/>
    <text x="14" y="6" fill="#a7a7b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">preview</text>
    <path d="M91 0h37" stroke="#3c3c49" stroke-width="2"/>
    <circle cx="139" r="5" fill="#5fd787"/>
    <text x="153" y="6" fill="#a7a7b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">create</text>
    <path d="M224 0h37" stroke="#3c3c49" stroke-width="2"/>
    <circle cx="272" r="5" fill="#5fd7d7"/>
    <text x="286" y="6" fill="#a7a7b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">execute</text>
    <path d="M366 0h37" stroke="#3c3c49" stroke-width="2"/>
    <circle cx="414" r="5" fill="#8f8f9d"/>
    <text x="428" y="6" fill="#a7a7b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">preserve</text>
  </g>
</svg>
